[project]
name = "snap-maintainer"
version = "0.1.0"
description = "Find out which of your published snaps need a rebuild or a new release, and how to do it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "rich>=13"]

[project.urls]
Homepage = "https://github.com/carlosbravoa/snap-maintainer"

[project.scripts]
snap-maintainer = "snap_maintainer.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
